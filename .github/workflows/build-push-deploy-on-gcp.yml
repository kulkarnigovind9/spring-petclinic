name: Build and Deploy to GKE
on:
  push:
    branches: [ gke-automation ]

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  GAR_LOCATION: gcr.io
  IMAGE: "${{ secrets.REPO_URL }}:${{ github.sha }}"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_AUTH }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}

      - name: Update image tag in deployment.yaml
        uses: Charlyzzz/update-k8s-image@v1.7.1
        with:
          manifest-path: k8s/deploy.yml
          new-image-tag: ${{ github.sha }}
          container-name: workload

      - name: Configure kubectl
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      # Deploy all Kubernetes manifests
      # The KUBECONFIG env var is automatically exported and picked up by kubectl.
      - id: 'get-pods'
        run: 'kubectl apply -f k8s/ --recursive'
